version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: chainpay-postgres
    environment:
      POSTGRES_DB: chainpay_db
      POSTGRES_USER: chainpay_user
      POSTGRES_PASSWORD: chainpay_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chainpay_user -d chainpay_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: chainpay-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  anvil:
    image: ghcr.io/foundry-rs/foundry:latest
    container_name: chainpay-anvil
    entrypoint: ["anvil", "--host", "0.0.0.0", "--port", "8545", "--chain-id", "31337"]
    ports:
      - "8545:8545"

  contract-deployer:
    image: ghcr.io/foundry-rs/foundry:latest
    container_name: chainpay-contract-deployer
    volumes:
      - ./contracts:/app/contracts
    working_dir: /app
    entrypoint: ["/app/contracts/deploy.sh"]
    environment:
      ETH_RPC_URL: "http://anvil:8545"
      PRIVATE_KEY: "0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80"
    depends_on:
      - anvil

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chainpay-core-app
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/chainpay_db
      SPRING_DATASOURCE_USERNAME: chainpay_user
      SPRING_DATASOURCE_PASSWORD: chainpay_password
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      CHAINPAY_WEB3_RPC_URL: http://anvil:8545
      CHAINPAY_WEB3_CHAIN_ID: 31337
      CHAINPAY_GATEWAY_ADDRESS: "0x2279B7A0a67DB372996a5FaB50D91eAA73d2eBe6"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      anvil:
        condition: service_started
      contract-deployer:
        condition: service_started

volumes:
  postgres_data:
  redis_data:
